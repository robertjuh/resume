# Install this first, before requesting the HTTPS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name robertwalhout.nl www.robertwalhout.nl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/robertwalhout-static.conf;
}
