# Install this only after Certbot has successfully issued the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name robertwalhout.nl www.robertwalhout.nl;

    # Keep HTTP validation available for automatic certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://robertwalhout.nl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.robertwalhout.nl;

    ssl_certificate /etc/letsencrypt/live/robertwalhout.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robertwalhout.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://robertwalhout.nl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name robertwalhout.nl;

    ssl_certificate /etc/letsencrypt/live/robertwalhout.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robertwalhout.nl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/robertwalhout-static.conf;
}
