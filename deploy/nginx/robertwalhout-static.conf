root /var/www/robertwalhout.nl/current;
index index.html;
charset utf-8;
charset_types text/css application/javascript application/json image/svg+xml;

# Retired CV downloads stay unavailable, even if an old file is copied back.
location ~* ^/(?:resume/)?cv(?:/|$) {
    return 404;
}

location ~ /\. {
    return 404;
}

# Revalidate HTML so an update loads its matching hashed bundles.
location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location ~* "^/[^/]+-[a-z0-9]{8,}\.(?:js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Navigation uses fragments (#projects), so missing files must return 404.
location / {
    try_files $uri $uri/ =404;
}
